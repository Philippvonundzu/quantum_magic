name: Build slides

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Upload PDF as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: main.pdf

      # On pushes to main, keep an always-current PDF on the "latest" release
      - name: Publish PDF to "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest slides
          prerelease: true
          files: main.pdf
